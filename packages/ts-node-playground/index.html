<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ts-node Playground</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; color: #7c8cf8; letter-spacing: 0.5px; }
  select { background: #252840; color: #e2e8f0; border: 1px solid #3d4270; border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; outline: none; }
  select:focus { border-color: #7c8cf8; }
  .view-toggle { display: flex; gap: 2px; background: #0f1117; border: 1px solid #2d3148; border-radius: 7px; padding: 2px; margin-left: auto; }
  .toggle-btn { background: none; border: none; color: #64748b; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 5px; cursor: pointer; transition: all 0.15s; }
  .toggle-btn.active { background: #252840; color: #e2e8f0; }
  .toggle-btn:not(.active):hover { color: #94a3b8; }

  .layout { display: flex; flex: 1; gap: 0; overflow: hidden; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .script-info { padding: 12px 20px; background: #13162a; border-bottom: 1px solid #2d3148; }
  .script-info .name { font-size: 13px; font-weight: 600; color: #7c8cf8; margin-bottom: 2px; }
  .script-info .desc { font-size: 12px; color: #94a3b8; }

  .history { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

  .card { border-radius: 10px; border: 1px solid #2d3148; padding: 14px 16px; background: #1a1d2e; }
  .card.past { opacity: 0.45; }
  .card.current { border-color: #7c8cf8; background: #1e2244; }
  .card.done { border-color: #34d399; background: #0d2e24; opacity: 0.8; }
  .card.error-card { border-color: #f87171; background: #2e1414; }

  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-coinFlip      { background: #7c3aed22; color: #c4b5fd; border: 1px solid #7c3aed55; }
  .badge-dialog        { background: #0369a122; color: #7dd3fc; border: 1px solid #0369a155; }
  .badge-dialogChoice  { background: #05966922; color: #6ee7b7; border: 1px solid #05966955; }
  .badge-random        { background: #dc262622; color: #fca5a5; border: 1px solid #dc262655; }
  .badge-randomChoice  { background: #ea580c22; color: #fdba74; border: 1px solid #ea580c55; }
  .badge-stateGet      { background: #0891b222; color: #67e8f9; border: 1px solid #0891b255; }
  .badge-stateSet      { background: #b4530022; color: #fdba74; border: 1px solid #b4530055; }
  .badge-stateAdd      { background: #05966922; color: #6ee7b7; border: 1px solid #05966955; }
  .badge-stateSubtract { background: #e11d4822; color: #fda4af; border: 1px solid #e11d4855; }
  .badge-stateMultiply { background: #7c3aed22; color: #c4b5fd; border: 1px solid #7c3aed55; }
  .badge-stateDivide   { background: #0369a122; color: #7dd3fc; border: 1px solid #0369a155; }
  .badge-stateUnset    { background: #47556922; color: #94a3b8; border: 1px solid #47556955; }
  .badge-greaterThan      { background: #05966922; color: #6ee7b7; border: 1px solid #05966955; }
  .badge-greaterThanOrEqual { background: #05966922; color: #6ee7b7; border: 1px solid #05966955; }
  .badge-lessThan         { background: #be123c22; color: #fda4af; border: 1px solid #be123c55; }
  .badge-lessThanOrEqual  { background: #be123c22; color: #fda4af; border: 1px solid #be123c55; }
  .badge-equalTo          { background: #71717122; color: #d4d4d8; border: 1px solid #71717155; }
  .badge-notEqualTo       { background: #71717122; color: #d4d4d8; border: 1px solid #71717155; }
  .badge-between          { background: #0369a122; color: #7dd3fc; border: 1px solid #0369a155; }
  .badge-contains         { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-startsWith       { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-endsWith         { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-in               { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-match            { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-empty            { background: #47556922; color: #94a3b8; border: 1px solid #47556955; }
  .badge-notEmpty         { background: #47556922; color: #94a3b8; border: 1px solid #47556955; }
  .badge-isSet            { background: #47556922; color: #94a3b8; border: 1px solid #47556955; }
  .badge-isNotSet         { background: #47556922; color: #94a3b8; border: 1px solid #47556955; }
  .badge-isTrue           { background: #16a34a22; color: #86efac; border: 1px solid #16a34a55; }
  .badge-isFalse          { background: #dc262622; color: #fca5a5; border: 1px solid #dc262655; }
  .badge-log           { background: #71717122; color: #d4d4d8; border: 1px solid #71717155; }
  .badge-include       { background: #92400022; color: #fcd34d; border: 1px solid #92400055; }
  .badge-end           { background: #16a34a22; color: #86efac; border: 1px solid #16a34a55; }
  .badge-default       { background: #33333322; color: #aaa; border: 1px solid #44444455; }
  .node-id { font-size: 11px; color: #64748b; }

  .card-body { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .card-body .row { display: flex; gap: 6px; }
  .card-body .label { color: #64748b; min-width: 80px; font-size: 12px; }
  .card-body .val { color: #e2e8f0; word-break: break-all; }
  .card-body .val.mono { font-family: monospace; color: #93c5fd; }
  .card-body .outcome { color: #7c8cf8; font-style: italic; font-size: 12px; margin-top: 4px; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choice-btn { background: #252840; color: #e2e8f0; border: 1px solid #3d4270; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .choice-btn:hover { background: #7c8cf8; border-color: #7c8cf8; color: #fff; }

  .action-bar { display: flex; gap: 8px; margin-top: 10px; }
  .btn { padding: 7px 16px; border-radius: 7px; font-size: 13px; cursor: pointer; border: none; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: #7c8cf8; color: #fff; }
  .btn-primary:hover { background: #6370e8; }
  .btn-reset { background: #252840; color: #94a3b8; border: 1px solid #3d4270; }
  .btn-reset:hover { background: #3d4270; color: #e2e8f0; }

  .arg-input { background: #0f1117; border: 1px solid #3d4270; color: #e2e8f0; border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 100%; font-family: monospace; outline: none; }
  .arg-input:focus { border-color: #7c8cf8; }

  .side { width: 260px; border-left: 1px solid #2d3148; background: #13162a; display: flex; flex-direction: column; overflow: hidden; }
  .side h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #64748b; padding: 12px 16px; border-bottom: 1px solid #2d3148; }
  .state-list { flex: 1; overflow-y: auto; padding: 10px 16px; font-size: 13px; }
  .state-empty { color: #475569; font-style: italic; font-size: 12px; padding: 8px 0; }
  .state-item { display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid #1e2244; }
  .state-key { color: #64748b; font-size: 11px; margin-bottom: 1px; }
  .state-val { color: #7dd3fc; font-family: monospace; word-break: break-all; }

  .script-view { flex: 1; overflow: auto; background: #0a0c14; background-image: linear-gradient(#1a1d2e 1px, transparent 1px), linear-gradient(90deg, #1a1d2e 1px, transparent 1px); background-size: 1rem 1rem; background-attachment: local; }
  .sv-canvas { position: relative; padding: 1rem; }
  .sv-node { position: absolute; background: #1a1d2e; border: 1px solid #2d3148; border-radius: 6px; display: flex; flex-direction: column; min-width: 0; }
  .sv-node.sv-entry { border-color: #7c8cf8; background: #1e2244; }
  .sv-node.dragging { opacity: 0.85; z-index: 10; cursor: grabbing; box-shadow: 0 4px 20px #0008; }
  .sv-node.selected { box-shadow: 0 0 0 2px #7c8cf8; }
  .sv-connections { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .sv-type { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.4px; cursor: grab; user-select: none; padding: 5px 8px; border-bottom: 1px solid #2d3148; flex-shrink: 0; display: flex; align-items: center; }
  .sv-type-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sv-entry .sv-type { color: #7c8cf8; }
  .sv-desc { font-size: 11px; color: #64748b; line-height: 1.4; padding: 5px 8px; overflow: hidden; }
  .sv-desc-edit { font-size: 11px; color: #94a3b8; line-height: 1.4; padding: 5px 8px; background: transparent; border: none; outline: none; resize: none; flex: 1; width: 100%; box-sizing: border-box; font-family: inherit; }
  .sv-desc-edit::placeholder { color: #2d3148; }
  .sv-desc-edit:focus { background: #12142a; border-radius: 0 0 6px 6px; }
  .sv-body { display: flex; flex: 1; }
  .sv-args { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 5px 6px; overflow: hidden; }
  .sv-arg { display: flex; flex-direction: column; gap: 1px; }
  .sv-arg-label { font-size: 10px; color: #475569; }
  .sv-arg-input { background: #0f1117; border: 1px solid #2d3148; color: #e2e8f0; border-radius: 4px; padding: 2px 5px; font-size: 11px; font-family: monospace; width: 100%; outline: none; }
  .sv-arg-input:focus { border-color: #7c8cf8; }
  .sv-pins { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 6px 4px; justify-content: flex-start; flex-shrink: 0; }
  .sv-pin { display: flex; align-items: center; gap: 5px; }
  .sv-pin-label { font-size: 10px; color: #475569; white-space: nowrap; }
  .sv-pin-dot { width: 9px; height: 9px; border-radius: 50%; background: #1a1d2e; border: 2px solid #3d4270; flex-shrink: 0; margin-right: -5px; }
  .sv-header-pin { width: 9px; height: 9px; border-radius: 50%; background: #1e2244; border: 2px solid #3d4270; flex-shrink: 0; margin-right: -5px; }
  .sv-input-pin { width: 9px; height: 9px; border-radius: 50%; background: #1a1d2e; border: 2px solid #3d4270; flex-shrink: 0; margin-left: -5px; }
  .ctx-menu { position: fixed; background: #1a1d2e; border: 1px solid #2d3148; border-radius: 6px; padding: 4px 0; min-width: 160px; max-height: 320px; overflow-y: auto; z-index: 1000; box-shadow: 0 8px 24px #0006; display: none; }
  .ctx-menu.open { display: block; }
  .ctx-item { padding: 6px 12px; font-size: 12px; color: #94a3b8; cursor: pointer; white-space: nowrap; }
  .ctx-item:hover { background: #252840; color: #e2e8f0; }
  .ctx-sep { height: 1px; background: #2d3148; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>ts-node playground</h1>
  <select id="scriptSelect"></select>
  <button class="btn btn-reset" onclick="resetScript()">↺ Reset</button>
  <div class="view-toggle">
    <button id="btnPlayground" class="toggle-btn active" onclick="setView('playground')">Playground</button>
    <button id="btnScript" class="toggle-btn" onclick="setView('script')">Script</button>
  </div>
</header>
<div class="layout" id="layoutView">
  <div class="main">
    <div class="script-info">
      <div class="name" id="scriptName"></div>
      <div class="desc" id="scriptDesc"></div>
    </div>
    <div class="history" id="history"></div>
  </div>
  <div class="side">
    <h2>State</h2>
    <div class="state-list" id="stateList"></div>
  </div>
</div>
<div class="script-view" id="scriptView" style="display:none">
  <div class="sv-canvas" id="svCanvas"></div>
</div>
<div class="ctx-menu" id="ctxMenu"></div>

<script>
let currentScript = null;
let state = new Map();
let historyCards = [];
const nodeFnCache = new Map();

async function loadNodeFn(type) {
  if (nodeFnCache.has(type)) return nodeFnCache.get(type);
  try {
    const res = await fetch('/api/nodes/' + type + '/compiled');
    if (!res.ok) { nodeFnCache.set(type, null); return null; }
    const code = await res.json();
    const clean = code
      .replace(/^import [^\n]+\n/gm, '')
      .replace(/^export (?:default )?/gm, '');
    const fn = new Function(clean + '\nreturn ' + type + ';')();
    nodeFnCache.set(type, fn);
    return fn;
  } catch(e) {
    nodeFnCache.set(type, null);
    return null;
  }
}

function nodeById(id) {
  return currentScript.nodes.find(n => n.id === id) || null;
}

function badgeClass(type) {
  const t = (type || '').toLowerCase();
  const map = { coinflip: 'coinFlip', dialog: 'dialog', dialogchoice: 'dialogChoice', random: 'random', randomchoice: 'randomChoice', stateget: 'stateGet', stateset: 'stateSet', stateadd: 'stateAdd', statesubtract: 'stateSubtract', statemultiply: 'stateMultiply', statedivide: 'stateDivide', stateunset: 'stateUnset',greaterthan: 'greaterThan', greaterthanorequal: 'greaterThanOrEqual', lessthan: 'lessThan', lessthanorequal: 'lessThanOrEqual', equalto: 'equalTo', notequalto: 'notEqualTo', between: 'between', contains: 'contains', startswith: 'startsWith', endswith: 'endsWith', in: 'in', match: 'match', empty: 'empty', notempty: 'notEmpty', isset: 'isSet', isnotset: 'isNotSet', istrue: 'isTrue', isfalse: 'isFalse', log: 'log', include: 'include', end: 'end' };
  return 'badge-' + (map[t] || 'default');
}

function evalValue(val) {
  const s = String(val);
  if (s.startsWith('`') && s.endsWith('`')) {
    return s.slice(1, -1).replace(/\${state\.get\('([^']+)'\)}/g, (_, k) => state.get(k) ?? '');
  }
  return s;
}

function renderState() {
  const el = document.getElementById('stateList');
  const entries = [...state.entries()].filter(([k]) => !k.startsWith('$'));
  if (entries.length === 0) {
    el.innerHTML = '<div class="state-empty">empty</div>';
    return;
  }
  el.innerHTML = entries.map(([k, v]) =>
    `<div class="state-item"><span class="state-key">${esc(k)}</span><span class="state-val">${esc(String(v))}</span></div>`
  ).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addHistoryCard(html) {
  historyCards.push(html);
}

function renderHistory(activeHtml) {
  const el = document.getElementById('history');
  const past = historyCards.map(h => `<div class="card past">${h}</div>`).join('');
  const active = activeHtml ? `<div class="card current" id="activeCard">${activeHtml}</div>` : '';
  el.innerHTML = past + active;
  el.scrollTop = el.scrollHeight;
}

function cardHeaderHtml(type, id) {
  return `<div class="card-header">
    <span class="badge ${badgeClass(type)}">${esc(type)}</span>
    <span class="node-id">node #${id}</span>
  </div>`;
}

const COMPARATOR_TYPES = new Set(['greaterThan','greaterThanOrEqual','lessThan','lessThanOrEqual','equalTo','notEqualTo','between','contains','startsWith','endsWith','in','match','empty','notEmpty','isSet','isNotSet','isTrue','isFalse']);

async function executeNode(nodeId) {
  if (nodeId === 0) {
    showEnd();
    return;
  }
  const node = nodeById(nodeId);
  if (!node) {
    showError(`Node ${nodeId} not found`);
    return;
  }

  const type = node.type;

  if (type === 'stateGet') {
    const key = String(node.args.key || '');
    const opNodeIds = Array.isArray(node.args.nodes) ? node.args.nodes : [];
    const firstOp = opNodeIds.length > 0 ? nodeById(opNodeIds[0]) : null;
    if (firstOp && COMPARATOR_TYPES.has(firstOp.type)) {
      state.set('$conditional.value', state.has(key) ? state.get(key) : undefined);
      state.set('$conditional.key', key);
      const body = `<div class="card-body">
        <div class="row"><span class="label">key</span><span class="val mono">${esc(key)}</span></div>
        <div class="row"><span class="label">value</span><span class="val mono">${esc(String(state.get('$conditional.value') ?? '(unset)'))}</span></div>
      </div>`;
      addHistoryCard(cardHeaderHtml(type, node.id) + body);
      executeNode(opNodeIds[0]);
    } else {
      const ops = opNodeIds.map(id => nodeById(id)).filter(Boolean);
      let nextId = 0;
      const opSummary = [];
      for (const op of ops) {
        const cur = state.has(key) ? parseFloat(String(state.get(key))) || 0 : 0;
        const val = op.args.value;
        if (op.type === 'stateSet') state.set(key, evalValue(String(val ?? '')));
        else if (op.type === 'stateAdd') state.set(key, cur + Number(val));
        else if (op.type === 'stateSubtract') state.set(key, cur - Number(val));
        else if (op.type === 'stateMultiply') state.set(key, cur * Number(val));
        else if (op.type === 'stateDivide') state.set(key, cur / Number(val));
        else if (op.type === 'stateUnset') state.delete(key);
        opSummary.push(val !== undefined ? `${op.type} ${val}` : op.type);
        if (nextId === 0) nextId = Array.isArray(op.args.nodes) ? (op.args.nodes[0] ?? 0) : 0;
      }
      renderState();
      const newVal = state.has(key) ? String(state.get(key)) : '(unset)';
      const body = `<div class="card-body">
        <div class="row"><span class="label">key</span><span class="val mono">${esc(key)}</span></div>
        <div class="row"><span class="label">ops</span><span class="val mono">${esc(opSummary.join(', '))}</span></div>
        <div class="row"><span class="label">result</span><span class="val mono">${esc(newVal)}</span></div>
        <div class="outcome">→ state updated</div>
      </div>`;
      addHistoryCard(cardHeaderHtml(type, node.id) + body);
      executeNode(nextId);
    }
    return;
  }

  if (COMPARATOR_TYPES.has(type)) {
    const raw = String(state.get('$conditional.value') ?? '');
    const t = Array.isArray(node.args.t) ? node.args.t : [];
    const f = Array.isArray(node.args.f) ? node.args.f : [];
    const fn = await loadNodeFn(type);
    let result = f;
    if (fn) {
      result = fn({ ...node.args, t, f, state });
    }
    const nextId = Array.isArray(result) ? (result[0] ?? 0) : 0;
    const isTrueBranch = result === t;
    const body = `<div class="card-body">
      <div class="row"><span class="label">value</span><span class="val mono">${esc(raw)}</span></div>
      <div class="row"><span class="label">result</span><span class="val" style="color:${isTrueBranch ? '#34d399' : '#f87171'}">${isTrueBranch ? 'true → t' : 'false → f'}</span></div>
    </div>`;
    addHistoryCard(cardHeaderHtml(type, node.id) + body);
    executeNode(nextId);
    return;
  }

  if (type === 'log') {
    const msg = evalValue(String(node.args.message || ''));
    const body = `<div class="card-body">
      <div class="row"><span class="label">message</span><span class="val">${esc(msg)}</span></div>
      <div class="outcome">→ logged</div>
    </div>`;
    const nextId = Array.isArray(node.args.nodes) ? (node.args.nodes[0] ?? 0) : 0;
    renderHistory(cardHeaderHtml(type, node.id) + body +
      `<div class="action-bar"><button class="btn btn-primary" onclick="advance(${nextId})">Continue</button></div>`);
    renderState();
    return;
  }

  if (type === 'coinFlip') {
    const t = Array.isArray(node.args.t) ? node.args.t : [];
    const f = Array.isArray(node.args.f) ? node.args.f : [];
    const fn = await loadNodeFn('coinFlip');
    const result = fn ? fn({ t, f }) : (Math.random() < 0.5 ? t : f);
    const isHeads = result === t;
    const nextId = Array.isArray(result) ? (result[0] ?? 0) : 0;
    const body = `<div class="card-body">
      <div class="row"><span class="label">result</span><span class="val">${isHeads ? 'Heads (true)' : 'Tails (false)'}</span></div>
      <div class="row"><span class="label">→ branch</span><span class="val mono">${isHeads ? 't' : 'f'}</span></div>
    </div>`;
    addHistoryCard(cardHeaderHtml(type, node.id) + body);
    executeNode(nextId);
    return;
  }

  if (type === 'dialog') {
    const character = evalValue(String(node.args.character || ''));
    const text = evalValue(String(node.args.text || ''));
    const choiceNodeIds = Array.isArray(node.args.nodes) ? node.args.nodes : [];
    const choices = choiceNodeIds.map(cid => nodeById(cid)).filter(Boolean);
    const choiceButtons = choices.map(c => {
      const choiceText = evalValue(String(c.args.text || 'Choice'));
      const nextId = Array.isArray(c.args.nodes) ? (c.args.nodes[0] ?? 0) : 0;
      return `<button class="choice-btn" onclick="pickChoice(${c.id}, '${esc(choiceText)}', ${nextId})">${esc(choiceText)}</button>`;
    }).join('');
    const body = `<div class="card-body">
      <div class="row"><span class="label">character</span><span class="val">${esc(character)}</span></div>
      <div class="row"><span class="label">text</span><span class="val">${esc(text)}</span></div>
      <div class="choices">${choiceButtons || '<span style="color:#64748b;font-size:12px">no choices</span>'}</div>
    </div>`;
    renderHistory(cardHeaderHtml(type, node.id) + body);
    renderState();
    window._pendingDialogNode = node.id;
    return;
  }

  if (type === 'random') {
    const choiceNodeIds = Array.isArray(node.args.nodes) ? node.args.nodes : [];
    const choices = choiceNodeIds.map(cid => nodeById(cid)).filter(Boolean);
    const totalWeight = choices.reduce((sum, c) => sum + (Number(c.args.weight) || 1), 0);
    let pick = Math.random() * totalWeight;
    let chosen = choices[choices.length - 1];
    for (const c of choices) {
      pick -= Number(c.args.weight) || 1;
      if (pick <= 0) { chosen = c; break; }
    }
    const nextId = chosen && Array.isArray(chosen.args.nodes) ? (chosen.args.nodes[0] ?? 0) : 0;
    const body = `<div class="card-body">
      <div class="row"><span class="label">choices</span><span class="val">${choices.length}</span></div>
      <div class="row"><span class="label">selected</span><span class="val mono">#${chosen ? chosen.id : '?'} (weight ${chosen ? (chosen.args.weight ?? 1) : 1})</span></div>
    </div>`;
    addHistoryCard(cardHeaderHtml(type, node.id) + body);
    executeNode(nextId);
    return;
  }

  if (type === 'include') {
    const scriptName = String(node.args.script || '');
    try {
      const res = await fetch('/api/scripts/' + scriptName);
      if (!res.ok) throw new Error('not found');
      const target = await res.json();
      const body = `<div class="card-body">
        <div class="row"><span class="label">script</span><span class="val">${esc(scriptName)}</span></div>
        <div class="outcome">→ including script</div>
      </div>`;
      addHistoryCard(cardHeaderHtml(type, node.id) + body);
      loadScript(target, state);
    } catch {
      showError(`Script "${scriptName}" not found`);
    }
    return;
  }

  // Unknown node type: use compiled code via new Function
  const fn = await loadNodeFn(type);
  if (fn) {
    const result = await Promise.resolve(fn({ ...node.args, state, node: nodeId }));
    const nextIds = Array.isArray(result) ? result : [];
    const nextId = nextIds[0] ?? 0;
    const argRows = Object.entries(node.args)
      .filter(([k]) => !['nodes', 'state', 'callstack'].includes(k))
      .map(([k, v]) => `<div class="row"><span class="label">${esc(k)}</span><span class="val mono">${esc(JSON.stringify(v))}</span></div>`)
      .join('');
    addHistoryCard(cardHeaderHtml(type, node.id) + `<div class="card-body">${argRows}</div>`);
    executeNode(nextId);
  } else {
    const argRows = Object.entries(node.args).filter(([k]) => k !== 'nodes' && k !== 'state' && k !== 'callstack').map(([k, v]) =>
      `<div class="row"><span class="label">${esc(k)}</span><span class="val mono">${esc(JSON.stringify(v))}</span></div>`
    ).join('');
    const nextId = Array.isArray(node.args.nodes) ? (node.args.nodes[0] ?? 0) : 0;
    renderHistory(cardHeaderHtml(type, node.id) + `<div class="card-body">${argRows}<div class="action-bar"><button class="btn btn-primary" onclick="advance(${nextId})">Continue</button></div></div>`);
    renderState();
  }
}

function pickChoice(choiceId, text, nextId) {
  const choiceNode = nodeById(choiceId);
  const dialogNode = window._pendingDialogNode != null ? nodeById(window._pendingDialogNode) : null;
  if (dialogNode) {
    const character = evalValue(String(dialogNode.args.character || ''));
    const dialogText = evalValue(String(dialogNode.args.text || ''));
    const body = `<div class="card-body">
      <div class="row"><span class="label">character</span><span class="val">${esc(character)}</span></div>
      <div class="row"><span class="label">text</span><span class="val">${esc(dialogText)}</span></div>
      <div class="row"><span class="label">selected</span><span class="val">${esc(text)}</span></div>
    </div>`;
    addHistoryCard(cardHeaderHtml(dialogNode.type, dialogNode.id) + body);
  }
  window._pendingDialogNode = null;
  executeNode(nextId);
}

function advance(nextId) {
  executeNode(nextId);
}

function showEnd() {
  renderHistory(`<div class="card-header"><span class="badge badge-end">complete</span></div>
    <div class="card-body"><div class="outcome">Script finished.</div></div>`);
  renderState();
}

function showError(msg) {
  renderHistory(`<div class="card-header"><span class="badge" style="background:#f8717122;color:#fca5a5;border:1px solid #f8717155">error</span></div>
    <div class="card-body"><div class="val" style="color:#fca5a5">${esc(msg)}</div></div>`);
}

function loadScript(script, inheritedState) {
  currentScript = script;
  _selected.clear();
  historyCards = [];
  state = inheritedState || new Map(Object.entries(script.initialState || {}));
  window._pendingDialogNode = null;
  document.getElementById('scriptName').textContent = script.name;
  document.getElementById('scriptDesc').textContent =
    script.nodes?.find(n => n.id === 0)?.description || script.comments?.[0]?.text || '';
  renderState();
  if (currentView === 'script') renderScriptView();
  const node0 = script.nodes?.find(n => n.id === 0);
  const startId = Array.isArray(node0?.args?.nodes) ? (node0.args.nodes[0] ?? 1) : 1;
  if (currentView === 'playground') executeNode(startId);
}

function resetScript() {
  if (currentScript) loadScriptByName(currentScript.name);
}

let currentView = 'playground';

async function setView(view) {
  const prev = currentView;
  currentView = view;
  document.getElementById('layoutView').style.display = view === 'playground' ? 'flex' : 'none';
  document.getElementById('scriptView').style.display = view === 'script' ? 'flex' : 'none';
  document.getElementById('btnPlayground').classList.toggle('active', view === 'playground');
  document.getElementById('btnScript').classList.toggle('active', view === 'script');
  if (view === 'script') await renderScriptView();
  if (view === 'playground' && prev === 'script' && currentScript) resetScript();
}

const nodeDefCache = new Map();

async function fetchNodeDef(type) {
  if (nodeDefCache.has(type)) return nodeDefCache.get(type);
  try {
    const res = await fetch('/api/nodes/' + type);
    const def = res.ok ? await res.json() : null;
    nodeDefCache.set(type, def);
    return def;
  } catch {
    nodeDefCache.set(type, null);
    return null;
  }
}

async function renderScriptView() {
  const canvas = document.getElementById('svCanvas');
  if (!currentScript) { canvas.innerHTML = ''; return; }

  const nodes = currentScript.nodes;
  const types = [...new Set(nodes.filter(n => n.id !== 0 && n.type).map(n => n.type))];
  await Promise.all(types.map(fetchNodeDef));

  canvas.innerHTML = '';
  canvas.innerHTML = nodes.map(node => {
    const x = node.x ?? 0;
    const y = node.y ?? 0;
    const w = node.width ?? 14;
    const h = node.height ?? 6;
    const isEntry = node.id === 0;

    if (isEntry) {
      const headerPin = node.args?.nodes != null ? `<span class="sv-header-pin"></span>` : '';
      return `<div class="sv-node sv-entry" data-id="0" style="left:${x}rem;top:${y}rem;width:${w}rem;height:${h}rem" onmousedown="onNodeMouseDown(event,0)">
        <div class="sv-type"><span class="sv-type-label">Entry</span>${headerPin}</div>
        <textarea class="sv-desc-edit" placeholder="Description..." onblur="saveEntryDesc(event)" onmousedown="event.stopPropagation()">${esc(node.description || '')}</textarea>
      </div>`;
    }

    const def = nodeDefCache.get(node.type) ?? null;
    const argDefs = def?.args ?? [];
    const pinDefs = (def?.nodes ?? []).filter(p => p.key !== 'nodes');

    const argsHtml = argDefs.map(a => {
      const val = node.args[a.key] ?? '';
      const inputType = a.editor === 'Number' ? 'number' : 'text';
      return `<div class="sv-arg">
        <span class="sv-arg-label">${esc(a.label)}</span>
        <input class="sv-arg-input" type="${inputType}" value="${esc(String(val))}">
      </div>`;
    }).join('');

    const pinsHtml = pinDefs.map(p => `<div class="sv-pin" data-key="${esc(p.key)}">
      <span class="sv-pin-label">${esc(p.label)}</span>
      <span class="sv-pin-dot"></span>
    </div>`).join('');

    const headerPin = node.args?.nodes != null ? `<span class="sv-header-pin"></span>` : '';
    return `<div class="sv-node" data-id="${node.id}" style="left:${x}rem;top:${y}rem;width:${w}rem;height:${h}rem" onmousedown="onNodeMouseDown(event,${node.id})">
      <div class="sv-type"><span class="sv-input-pin"></span><span class="sv-type-label">${esc(node.type || 'unknown')}</span>${headerPin}</div>
      <div class="sv-body">
        <div class="sv-args">${argsHtml}</div>
        <div class="sv-pins">${pinsHtml}</div>
      </div>
    </div>`;
  }).join('') + '<div id="svSpacer" style="position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none;"></div>';
  updateCanvasSize();
  requestAnimationFrame(drawConnections);
}

async function loadScriptByName(name) {
  try {
    const res = await fetch('/api/scripts/' + name);
    if (!res.ok) throw new Error('not found');
    const script = await res.json();
    loadScript(script, null);
  } catch {
    showError('Failed to load script: ' + name);
  }
}

let _selected = new Set();

function onNodeMouseDown(e, nodeId) {
  if (e.shiftKey) {
    if (_selected.has(nodeId)) _selected.delete(nodeId);
    else _selected.add(nodeId);
  } else {
    if (!_selected.has(nodeId)) {
      _selected.clear();
      _selected.add(nodeId);
    }
  }
  renderSelection();
  e.stopPropagation();
  if (e.target.closest('.sv-type')) startDrag(e, nodeId);
}

function renderSelection() {
  const canvas = document.getElementById('svCanvas');
  if (!canvas) return;
  canvas.querySelectorAll('.sv-node').forEach(el => {
    el.classList.toggle('selected', _selected.has(Number(el.dataset.id)));
  });
}

async function deleteSelectedNodes() {
  if (!currentScript || _selected.size === 0) return;
  const toDelete = [..._selected].filter(id => id !== 0);
  if (toDelete.length === 0) return;
  currentScript.nodes = currentScript.nodes.filter(n => !toDelete.includes(n.id));
  _selected.clear();
  await Promise.all(toDelete.map(id =>
    fetch('/api/scripts/' + currentScript.name + '/nodes/' + id, { method: 'DELETE' })
  ));
  await renderScriptView();
}

async function moveSelectedNodes(dx, dy) {
  if (!currentScript || _selected.size === 0) return;
  const canvas = document.getElementById('svCanvas');
  const patches = [];
  for (const id of _selected) {
    const node = currentScript.nodes.find(n => n.id === id);
    if (!node) continue;
    node.x = Math.max(0, (node.x ?? 0) + dx);
    node.y = Math.max(0, (node.y ?? 0) + dy);
    const el = canvas?.querySelector('.sv-node[data-id="' + id + '"]');
    if (el) { el.style.left = node.x + 'rem'; el.style.top = node.y + 'rem'; }
    patches.push(fetch('/api/scripts/' + currentScript.name + '/nodes/' + id, {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ x: node.x, y: node.y }),
    }));
  }
  updateCanvasSize();
  drawConnections();
  await Promise.all(patches);
}

let _drag = null;

function startDrag(e, nodeId) {
  e.preventDefault();
  const nodeEl = e.currentTarget.closest('.sv-node');
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const node = currentScript.nodes.find(n => n.id === nodeId);
  nodeEl.classList.add('dragging');
  _drag = { nodeId, nodeEl, origX: node.x ?? 0, origY: node.y ?? 0, startX: e.clientX, startY: e.clientY, rem };
  document.addEventListener('mousemove', _onDragMove);
  document.addEventListener('mouseup', _onDragEnd);
}

function _onDragMove(e) {
  if (!_drag) return;
  const { nodeEl, origX, origY, startX, startY, rem } = _drag;
  nodeEl.style.left = Math.max(0, origX + (e.clientX - startX) / rem) + 'rem';
  nodeEl.style.top  = Math.max(0, origY + (e.clientY - startY) / rem) + 'rem';
  drawConnections();
}

function _onDragEnd(e) {
  if (!_drag) return;
  document.removeEventListener('mousemove', _onDragMove);
  document.removeEventListener('mouseup', _onDragEnd);
  const { nodeId, nodeEl, origX, origY, startX, startY, rem } = _drag;
  _drag = null;
  nodeEl.classList.remove('dragging');
  const newX = Math.max(0, Math.round(origX + (e.clientX - startX) / rem));
  const newY = Math.max(0, Math.round(origY + (e.clientY - startY) / rem));
  nodeEl.style.left = newX + 'rem';
  nodeEl.style.top  = newY + 'rem';
  const node = currentScript.nodes.find(n => n.id === nodeId);
  if (node) { node.x = newX; node.y = newY; }
  if (newX !== origX || newY !== origY) {
    fetch('/api/scripts/' + currentScript.name + '/nodes/' + nodeId, {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ x: newX, y: newY }),
    });
  }
  updateCanvasSize();
  drawConnections();
}

function updateCanvasSize() {
  if (!currentScript) return;
  let maxX = 0;
  let maxY = 0;
  for (const n of currentScript.nodes) {
    maxX = Math.max(maxX, (n.x ?? 0) + (n.width ?? 14));
    maxY = Math.max(maxY, (n.y ?? 0) + (n.height ?? 6));
  }
  const spacer = document.getElementById('svSpacer');
  if (spacer) {
    spacer.style.left = (maxX + 20) + 'rem';
    spacer.style.top  = (maxY + 20) + 'rem';
  }
}

function drawConnections() {
  const canvas = document.getElementById('svCanvas');
  if (!canvas || !currentScript) return;

  let svg = canvas.querySelector('.sv-connections');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('sv-connections');
    canvas.insertBefore(svg, canvas.firstChild);
  }
  svg.innerHTML = '';

  const cr = canvas.getBoundingClientRect();

  function pinPos(el, side) {
    const r = el.getBoundingClientRect();
    return { x: (side === 'r' ? r.right : r.left) - cr.left, y: r.top + r.height / 2 - cr.top };
  }

  for (const node of currentScript.nodes) {
    const nodeEl = canvas.querySelector('.sv-node[data-id="' + node.id + '"]');
    if (!nodeEl) continue;

    if (Array.isArray(node.args?.nodes) && node.args.nodes.length) {
      const srcEl = nodeEl.querySelector('.sv-header-pin');
      if (srcEl) {
        const src = pinPos(srcEl, 'r');
        for (const tid of node.args.nodes) {
          const tgtEl = canvas.querySelector('.sv-node[data-id="' + tid + '"] .sv-input-pin');
          if (tgtEl) drawPath(svg, src, pinPos(tgtEl, 'l'));
        }
      }
    }

    const pinEls = nodeEl.querySelectorAll('.sv-pin[data-key]');
    for (const pinEl of pinEls) {
      const val = node.args?.[pinEl.dataset.key];
      if (!val) continue;
      const targets = Array.isArray(val) ? val : [val];
      const dotEl = pinEl.querySelector('.sv-pin-dot');
      if (!dotEl) continue;
      const src = pinPos(dotEl, 'r');
      for (const tid of targets) {
        const tgtEl = canvas.querySelector('.sv-node[data-id="' + tid + '"] .sv-input-pin');
        if (tgtEl) drawPath(svg, src, pinPos(tgtEl, 'l'));
      }
    }
  }
}

function drawPath(svg, src, tgt) {
  const dx = Math.max(Math.abs(tgt.x - src.x) * 0.5, 30);
  const d = 'M ' + src.x + ',' + src.y + ' C ' + (src.x + dx) + ',' + src.y + ' ' + (tgt.x - dx) + ',' + tgt.y + ' ' + tgt.x + ',' + tgt.y;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#4a5580');
  path.setAttribute('stroke-width', '1.5');
  svg.appendChild(path);
}

async function saveEntryDesc(e) {
  const val = e.target.value;
  const node = currentScript.nodes.find(n => n.id === 0);
  if (!node || val === (node.description || '')) return;
  node.description = val;
  const descEl = document.querySelector('.script-info .desc');
  if (descEl) descEl.textContent = val;
  await fetch('/api/scripts/' + currentScript.name + '/nodes/0', {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ description: val }),
  });
}

let _ctxPos = { x: 0, y: 0 };

async function openCtxMenu(clientX, clientY) {
  const menu = document.getElementById('ctxMenu');
  const canvas = document.getElementById('svCanvas');
  const cr = canvas.getBoundingClientRect();
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  _ctxPos = {
    x: Math.round((clientX - cr.left) / rem),
    y: Math.round((clientY - cr.top) / rem),
  };
  menu.innerHTML = '<div class="ctx-item" style="color:#475569;cursor:default">Add node</div><div class="ctx-sep"></div>';
  menu.style.left = clientX + 'px';
  menu.style.top  = clientY + 'px';
  menu.classList.add('open');
  const nodes = await fetch('/api/nodes').then(r => r.json());
  menu.innerHTML = '<div class="ctx-item" style="color:#475569;cursor:default">Add node</div><div class="ctx-sep"></div>' +
    nodes.map(n => `<div class="ctx-item" data-type="${esc(n.name)}">${esc(n.description || n.name)}</div>`).join('');
  menu.querySelectorAll('.ctx-item[data-type]').forEach(el => {
    el.addEventListener('click', () => addNodeAtPos(el.dataset.type));
  });
}

function closeCtxMenu() {
  document.getElementById('ctxMenu').classList.remove('open');
}

async function addNodeAtPos(type) {
  closeCtxMenu();
  const res = await fetch('/api/scripts/' + currentScript.name + '/nodes', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type, x: _ctxPos.x, y: _ctxPos.y }),
  });
  if (!res.ok) return;
  const node = await res.json();
  currentScript.nodes.push(node);
  await renderScriptView();
}

async function init() {
  try {
    const scripts = await fetch('/api/scripts').then(r => r.json());
    const sel = document.getElementById('scriptSelect');
    scripts.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => loadScriptByName(sel.value));
    if (scripts.length > 0) loadScriptByName(scripts[0].name);
  } catch {
    showError('Failed to connect to API. Is the server running?');
  }
}

document.addEventListener('mousedown', e => {
  if (currentView !== 'script' || !currentScript) return;
  if (e.target.closest('.sv-node')) return;
  if (_selected.size === 0) return;
  _selected.clear();
  renderSelection();
});
document.addEventListener('contextmenu', e => {
  if (currentView !== 'script' || !currentScript) return;
  if (!document.getElementById('scriptView').contains(e.target)) return;
  e.preventDefault();
  if (e.target.closest('.sv-node')) return;
  openCtxMenu(e.clientX, e.clientY);
});
document.addEventListener('click', e => { if (e.button === 0) closeCtxMenu(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCtxMenu(); return; }
  if (currentView !== 'script' || !currentScript) return;
  const tag = document.activeElement?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelectedNodes(); return; }
  const arrowMap = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrowMap[e.key]) { e.preventDefault(); moveSelectedNodes(...arrowMap[e.key]); }
});

init();
</script>
</body>
